<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MakerPrompt</title>
    <meta name="title" content="MakerPrompt - Open Source 3D Printer Management">
    <meta name="description" content="Cross-platform, open-source 3D printer management for local serial and network-connected printers.">
    <meta name="keywords" content="3D printer management, Blazor Hybrid, open source 3D printing, PrusaLink, Prusa Connect, Moonraker, OctoPrint, Web Serial" />
    <meta name="robots" content="index, follow">
    <meta name="author" content="Akın Bender" />
    <base href="/" />
    <script>
        (function () {
            try {
                var configJson = window.localStorage.getItem('AppConfig');
                var themeKey = 'auto';
                if (configJson) {
                    var config = JSON.parse(configJson);
                    if (config && config.Theme !== undefined && config.Theme !== null) {
                        var raw = config.Theme;
                        if (typeof raw === 'string') {
                            themeKey = raw.toLowerCase();
                        } else if (typeof raw === 'number') {
                            switch (raw) {
                                case 1: themeKey = 'light'; break;   // Theme.Light
                                case 2: themeKey = 'dark'; break;    // Theme.Dark
                                case 3: themeKey = 'mpdark'; break;  // Theme.MpDark
                                default: themeKey = 'auto'; break;   // Theme.Auto or unknown
                            }
                        }
                    }
                }

                var resolvedTheme = themeKey;
                if (!resolvedTheme || resolvedTheme === 'auto') {
                    resolvedTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                        ? 'dark'
                        : 'light';
                }

                document.documentElement.setAttribute('data-bs-theme', resolvedTheme);
                document.documentElement.style.colorScheme = resolvedTheme;
            } catch { }
        })();
    </script>
    <link rel="stylesheet" href="MakerPrompt.UI.Blazor.styles.css" />
    <link rel="stylesheet" href="_content/MakerPrompt.UI.Components/lib/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="_content/MakerPrompt.UI.Components/lib/bootstrap-icons/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="_content/Blazor.Bootstrap/blazor.bootstrap.css" />
    <link rel="stylesheet" href="_content/MakerPrompt.UI.Components/css/app.css" />
    <link rel="icon" type="image/png" href="_content/MakerPrompt.UI.Components/favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" href="_content/MakerPrompt.UI.Components/favicon.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_content/MakerPrompt.UI.Components/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="_content/MakerPrompt.UI.Components/lib/gcode-preview/gcode-preview.bundle.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/Blazor.Bootstrap/blazor.bootstrap.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
    <script>
        window.blazorCulture = {
            get: () => window.localStorage['BlazorCulture'],
            set: (value) => window.localStorage['BlazorCulture'] = value
        };
    </script>
</body>

</html>
