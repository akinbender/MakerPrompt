name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install MAUI workloads
      run: |
        dotnet workload install maui
        dotnet workload install maui-windows
        
    - name: Restore dependencies (MAUI Windows)
      run: dotnet restore src/MakerPrompt.UI.MAUI/MakerPrompt.UI.MAUI.csproj -p:TargetFramework=net10.0-windows10.0.19041.0 -p:RuntimeIdentifierOverride=win-x64

    - name: Restore dependencies (Blazor)
      run: dotnet restore src/MakerPrompt.UI.Blazor/MakerPrompt.UI.Blazor.csproj

    - name: Restore dependencies (Cloud and Edge)
      run: |
        dotnet restore src/MakerPrompt.Cloud/MakerPrompt.Cloud.csproj
        dotnet restore src/MakerPrompt.EdgeAgent/MakerPrompt.EdgeAgent.csproj

    - name: Restore dependencies (Unit tests)
      run: |
        dotnet restore tests/MakerPrompt.Tests.Unit/MakerPrompt.Tests.Unit.csproj
        dotnet restore tests/MakerPrompt.Tests.Integration/MakerPrompt.Tests.Integration.csproj

    - name: Build (Windows)
      run: dotnet build src/MakerPrompt.UI.MAUI/MakerPrompt.UI.MAUI.csproj -c Release -f net10.0-windows10.0.19041.0 -p:RuntimeIdentifierOverride=win-x64 --no-restore

    - name: Build (Blazor WebAssembly)
      run: dotnet build src/MakerPrompt.UI.Blazor/MakerPrompt.UI.Blazor.csproj -c Release --no-restore

    - name: Build (Cloud)
      run: dotnet build src/MakerPrompt.Cloud/MakerPrompt.Cloud.csproj -c Release --no-restore

    - name: Build (EdgeAgent)
      run: dotnet build src/MakerPrompt.EdgeAgent/MakerPrompt.EdgeAgent.csproj -c Release --no-restore

    - name: Test (Unit)
      run: dotnet test tests/MakerPrompt.Tests.Unit/MakerPrompt.Tests.Unit.csproj -c Release --no-restore

    - name: Test (Cloud integration)
      run: dotnet test tests/MakerPrompt.Tests.Integration/MakerPrompt.Tests.Integration.csproj -c Release --no-restore
