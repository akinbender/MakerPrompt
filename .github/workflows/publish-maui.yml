name: Publish MAUI Apps

on:
  push:
    tags:
    - 'v*'

env:
  MAUI_PROJECT_DIR: 'src/MakerPrompt.UI.MAUI/'
  MAUI_PROJECT: 'src/MakerPrompt.UI.MAUI/MakerPrompt.UI.MAUI.csproj'
  OUTPUT_DIR: 'publish'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install MAUI workloads
      run: |
        dotnet workload install maui-windows
        dotnet workload install maui-android

    - name: Publish MAUI Windows 10 (x64)
      run: dotnet publish ${{ env.MAUI_PROJECT }} -c Release -f net10.0-windows10.0.19041.0 -r win-x64 -p:WindowsPackageType=None --self-contained false -o ${{ env.OUTPUT_DIR }}/windows10-x64

    - name: Publish MAUI Windows 11 (x64)
      run: dotnet publish ${{ env.MAUI_PROJECT }} -c Release -f net10.0-windows10.0.22000.0 -r win-x64 -p:WindowsPackageType=None --self-contained false -o ${{ env.OUTPUT_DIR }}/windows11-x64

    - name: Publish MAUI Android
      run: dotnet publish ${{ env.MAUI_PROJECT }} -c Release -f net10.0-android -o ${{ env.OUTPUT_DIR }}/android


    - name: Zip Windows 10 x64 release
      uses: vimtor/action-zip@v1.2
      with:
        files: ${{ env.OUTPUT_DIR }}/windows10-x64
        dest: windows10-x64-release.zip

    - name: Zip Windows 11 x64 release
      uses: vimtor/action-zip@v1.2
      with:
        files: ${{ env.OUTPUT_DIR }}/windows11-x64
        dest: windows11-x64-release.zip

    - name: Zip Android Release
      uses: vimtor/action-zip@v1.2
      with:
        files: ${{ env.OUTPUT_DIR }}/android
        dest: android-release.zip

    - name: Release
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      with:
         body_path: ${{ github.workspace }}/CHANGELOG.md
         make_latest: true
         files: |
           windows10-x64-release.zip
           windows11-x64-release.zip
           android-release.zip

  build-maccatalyst:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install MAUI workloads
      run: dotnet workload install maui-maccatalyst

    - name: Publish MAUI MacCatalyst x64
      run: dotnet publish ${{ env.MAUI_PROJECT }} -c Release -f net10.0-maccatalyst -r maccatalyst-x64 -o ${{ env.OUTPUT_DIR }}/maccatalyst-x64

    - name: Publish MAUI MacCatalyst arm64
      run: dotnet publish ${{ env.MAUI_PROJECT }} -c Release -f net10.0-maccatalyst -r maccatalyst-arm64 -o ${{ env.OUTPUT_DIR }}/maccatalyst-arm64

    - name: Create MacCatalyst x64 DMG
      run: |
        hdiutil create \
          -volname "MakerPrompt" \
          -srcfolder "${{ env.OUTPUT_DIR }}/maccatalyst-x64/MakerPrompt.UI.MAUI.app" \
          -ov -format UDZO \
          "makerprompt-maccatalyst-x64.dmg"

    - name: Create MacCatalyst arm64 DMG
      run: |
        hdiutil create \
          -volname "MakerPrompt" \
          -srcfolder "${{ env.OUTPUT_DIR }}/maccatalyst-arm64/MakerPrompt.UI.MAUI.app" \
          -ov -format UDZO \
          "makerprompt-maccatalyst-arm64.dmg"

    - name: Release MacCatalyst assets
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      with:
        body_path: ${{ github.workspace }}/CHANGELOG.md
        make_latest: true
        files: |
          makerprompt-maccatalyst-x64.dmg
          makerprompt-maccatalyst-arm64.dmg
